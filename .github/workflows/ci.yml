name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: make lint
      - run: make test
      - run: make example
      - run: uv run python -c "import nbformat; nbformat.validate(nbformat.read('packages/judge-cal/notebooks/ci-with-judge-error.ipynb', 4))"
      - name: CITATION.cff is valid
        run: uvx cffconvert --validate

  sandbox-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f packages/eval-harness/docker/sandbox.Dockerfile -t eval-sandbox .
