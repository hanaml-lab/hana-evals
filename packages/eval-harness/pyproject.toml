[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eval-harness"
version = "0.9.0"
description = "Runs agents against long, multi-stage jobs, places checks where an error would cost most, and scores every stage."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "hanaML", email = "hello@hanaml.com" }]
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
duckdb = ["duckdb>=1.0"]
inspect = ["inspect-ai>=0.3.50", "inspect-evals"]

[project.scripts]
eval-harness = "eval_harness.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/eval_harness"]
