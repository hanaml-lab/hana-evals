# Generated from fixed seeds; edit the stages freely, regenerate the jobs with care.
name: back-office-reconcile
description: Reconcile a supplier's September invoices against the ledger, draft the follow-up and decide on payment.
stages:
- id: invoices
  tool: load
  params:
    key: invoices
  undo_cost: 2
  instructions: Fetch the supplier's invoices for September.
- id: ledger
  tool: load
  params:
    key: ledger
  undo_cost: 2
  instructions: Read the ledger entries for the supplier.
- id: match_invoices
  tool: match_invoices
  deps:
  - invoices
  - ledger
  undo_cost: 2
  instructions: Pair each invoice with its ledger entry by reference.
- id: flag_mismatches
  tool: flag_mismatches
  deps:
  - match_invoices
  params:
    tolerance: 0.01
  undo_cost: 2
  instructions: List invoice references whose amounts differ or that are missing from the ledger.
- id: invoice_total
  tool: total
  deps:
  - invoices
  undo_cost: 1
  instructions: Sum the invoice amounts.
- id: ledger_total
  tool: total
  deps:
  - ledger
  undo_cost: 1
  instructions: Sum the ledger amounts.
- id: balance
  tool: balance
  deps:
  - invoice_total
  - ledger_total
  params:
    between:
    - invoice_total
    - ledger_total
  undo_cost: 1
  instructions: Difference between invoice and ledger totals.
- id: draft_email
  tool: draft_email
  deps:
  - flag_mismatches
  check: judge
  undo_cost: 3
  instructions: Draft an email to the supplier listing every mismatched invoice.
- id: approve_payment
  tool: approve_payment
  deps:
  - flag_mismatches
  - invoice_total
  params:
    limit: 10000
  undo_cost: 8
  critical: true
  instructions: Approve payment only when nothing is flagged and the total is within the limit.
